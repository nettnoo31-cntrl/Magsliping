Я создан для новых пользователей. Когда открываешь игру впервые, вокруг много непонятного: лента объявлений, чаты, склад, ремонт, индекс. Моя задача — спокойно провести тебя через всё это и объяснить каждую кнопку простыми словами.|||I was created for new users. When you open the game for the first time there is a lot that looks confusing: the listings feed, chats, stock, repairs, the index. My job is to calmly walk you through all of it and explain every button in plain words.
Главная идея игры — купить телефон дешевле рынка и продать дороже. Заходи в «Ленту», сравнивай цену лота с рыночной, пиши продавцу и торгуйся. Продавцы бывают разными: кто-то уступает сразу, кто-то стоит на своём. Если перегнёшь палку, телефон купят другие.|||The main idea of the game is to buy a phone below market price and sell it higher. Open the Feed, compare a listing's price with the market price, message the seller and haggle. Sellers differ: some give in at once, others hold their ground. If you push too hard, someone else will buy the phone.
Следи за состоянием телефона. Царапины, разбитый экран, села батарея, хрипит динамик — всё это снижает цену, но даёт возможность заработать. Слишком дешёвые лоты могут прятать скрытый дефект, поэтому не хватай всё подряд, пока не накопил деньги на запас.|||Watch the condition of the phone. Scratches, a broken screen, a dead battery, a crackling speaker — all of it lowers the price but gives you a chance to profit. Too-cheap listings may hide a defect, so do not grab everything until you have saved some money in reserve.
